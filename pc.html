<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SparklingTones PC</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="pc.webmanifest">
<meta name="theme-color" content="#1e232b">
<style>
  /* La versione per il PC (9 novembre 2026): la disposizione e i colori del Pulze Mazz Editor
     (grigio-blu ardesia, selezioni blu), le manopole dell'editor classico, le immagini del neon.
     Bozza approvata dall'utente: design/pc/bozza.html. Codice in src/pc/. */
  @font-face { font-family:'Inter'; src:url('fonts/inter-latin.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  @font-face { font-family:'Space Grotesk'; src:url('fonts/space-grotesk-latin.woff2') format('woff2'); font-weight:300 700; font-display:swap; }

  :root {
    color-scheme:dark;
    --bg:#1e232b; --panel:#2a313c; --panel2:#323a47; --line:#3a4351; --line-soft:#303844;
    --text:#dde3ec; --dim:#9aa4b3; --faint:#687384;
    --incavo:#1b2028; --rialzo:#36404d; --traccia:#3f4957;
    --accent:#2f7fe8; --accent-chiaro:#4c95f0; --su-accent:#ffffff;
    --green:#4cd38a; --rosso:#ff7a7a; --ambra:#f5b041;
    --slot-a:#e5484d; --slot-b:#3fbf6f; --crema:#e6cfa4;
    --font:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    --strumento:'Space Grotesk','Inter',-apple-system,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; overflow:hidden; min-width:980px; }
  [hidden] { display:none !important; }
  button { font-family:var(--strumento); font-size:0.82rem; font-weight:600; letter-spacing:0.02em; color:var(--text);
           background:var(--rialzo); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--faint); }
  button:disabled { opacity:0.4; cursor:default; }
  button.primario { background:var(--accent); border-color:var(--accent); color:var(--su-accent); }
  button.primario:hover:not(:disabled) { background:var(--accent-chiaro); border-color:var(--accent-chiaro); }
  button.pericolo { color:var(--rosso); }
  :focus-visible { outline:2px solid var(--accent-chiaro); outline-offset:2px; }
  svg.ico { width:16px; height:16px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------------------------------------------------------------- la barra in alto */
  .barra { flex:none; display:flex; align-items:center; gap:8px; padding:8px 16px;
           background:linear-gradient(#2f3743, #262d37); border-bottom:1px solid var(--line); }
  .logo { height:34px; width:auto; display:block; }
  .logo-pc { font-family:var(--strumento); font-size:0.66rem; font-weight:700; letter-spacing:0.1em; color:var(--faint);
             border:1px solid var(--line); border-radius:5px; padding:2px 6px; margin-left:4px; }
  .spazio { flex:1; }
  .gruppo { display:flex; align-items:center; gap:8px; background:var(--incavo); border:1px solid var(--line);
            border-radius:10px; padding:4px 8px; }
  .gruppo .etichetta { font-family:var(--strumento); font-size:0.7rem; color:var(--dim); letter-spacing:0.06em; text-transform:uppercase; }
  .numero { width:3.6em; font-family:var(--strumento); font-size:0.95rem; font-weight:600; color:var(--text);
            background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 5px; text-align:center; }
  .numero:disabled { color:var(--faint); }
  .aiuto, .sotto-barra .gruppo button.aiuto { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; margin-left:6px;
    border-radius:50%; font:600 0.72rem var(--strumento); color:var(--text); background:var(--rialzo); border:1px solid var(--dim);
    vertical-align:middle; cursor:pointer; flex:none; position:relative; top:-1px; }
  .aiuto:hover, .sotto-barra .gruppo button.aiuto:hover:not(:disabled) { background:var(--accent); border-color:var(--accent); color:var(--su-accent); }
  .gruppo .tap { font-family:var(--strumento); font-size:0.75rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 9px; border-radius:6px; }
  .gruppo .tap.battuto { background:var(--rialzo); }
  #nome-ampli { font-family:var(--strumento); font-size:0.78rem; color:var(--dim); }
  .lampada { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); margin-right:7px; vertical-align:1px; }
  #collega.attivo { background:var(--rialzo); border-color:var(--line); color:var(--text); }
  #collega.attivo .lampada { background:var(--green); box-shadow:0 0 7px rgba(76,211,138,0.7); }
  #collega.attesa .lampada { background:var(--ambra); }
  #genera-ia { display:flex; align-items:center; gap:7px; flex:none; line-height:16px; }
  #menu { padding:6px 9px; }
  #menu svg { width:20px; height:20px; }

  /* ---------------------------------------------------------------- sotto la barra */
  /* Il nome del preset sta al centro della finestra: le due colonne ai lati sono uguali (9 novembre,
     l'utente: «la scritta non è in centro»). Sotto i 1300 px i tasti ai lati restano con la sola icona. */
  .sotto-barra { flex:none; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, min(420px, 32vw)) minmax(0, 1fr);
                 align-items:center; gap:14px; padding:6px 16px 5px; background:var(--incavo); border-bottom:1px solid var(--line-soft); }
  .sb-lato { display:flex; align-items:center; gap:8px; min-width:0; }
  @media (max-width:1300px) { .sotto-barra .testo { display:none; } }
  .sb-lato.destra { justify-content:flex-end; }
  .sotto-barra .gruppo { background:var(--panel); gap:2px; padding:3px 4px; }
  .sotto-barra .gruppo button { padding:4px 8px; display:flex; align-items:center; gap:6px; background:transparent; border-color:transparent; }
  .sotto-barra .gruppo button:hover:not(:disabled) { background:var(--rialzo); }
  #salva.da-salvare { color:var(--ambra); }
  #confronta { font-weight:700; font-size:0.78rem; letter-spacing:0.04em; }
  #confronta.attivo { background:var(--ambra) !important; color:#1b2028; }
  /* il centro come nel Pulze: il nome grande da solo, in centro anche in verticale; lo slot e «modificato» accanto,
     fuori dal conto del centro */
  .preset-centro { display:flex; flex-direction:column; align-items:center; justify-content:center; align-self:stretch; min-width:0; }
  .preset-riga { display:flex; align-items:center; gap:10px; min-width:0; max-width:100%; position:relative; }
  .preset-riga .accanto { position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .freccia { flex:none; width:34px; height:34px; padding:0; border-radius:50%; display:grid; place-items:center; }
  .freccia > svg.ico { width:18px; height:18px; }
  #preset-nome { font-family:var(--strumento); font-size:1.65rem; line-height:1.15; letter-spacing:0.01em; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #preset-dove { font-family:var(--strumento); font-size:0.7rem; font-weight:700; letter-spacing:0.05em; color:var(--faint);
                 border:1px solid var(--line); border-radius:5px; padding:1px 6px; flex:none; }
  #modificato { font-family:var(--strumento); font-size:0.66rem; font-weight:600; letter-spacing:0.03em; color:var(--ambra); flex:none;
                border:1px solid var(--ambra); border-radius:999px; padding:1px 9px; white-space:nowrap; }
  @media (max-width:1279px) {
    /* poco posto: solo un pallino ambra (il titolo dice cosa), come nel Pulze */
    #modificato { width:11px; height:11px; padding:0; font-size:0; border-radius:50%; background:var(--ambra); }
  }
  #modificato.confronto { background:rgba(245,176,65,0.12); }
  /* la riga di stato sta nella barra in alto, accanto al logo: sotto il nome lo spingeva in alto (9 novembre) */
  #stato { flex:1; min-width:0; margin-left:14px; font-size:0.8rem; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stato[data-tipo="errore"] { color:var(--rosso); }
  #stato[data-tipo="ok"] { color:var(--green); }

  /* ---------------------------------------------------------------- il palco */
  .centro { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1fr) 290px; gap:14px; padding:14px 16px 0; }
  .centro-sinistra { display:flex; min-width:0; min-height:0; }

  /* ---------------------------------------------------------------- la libreria a destra (l'elenco dei tone del Pulze) */
  #elenco { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column;
            gap:8px; min-height:0; min-width:0; }
  .elenco-cima { display:flex; gap:6px; }
  #elenco-cerca { flex:1; min-width:0; font:inherit; font-size:0.86rem; color:var(--text); background:var(--incavo); border:1px solid var(--line);
                  border-radius:7px; padding:6px 9px; }
  #elenco-ordine { padding:5px 8px; }
  .scegli-preset input { width:100%; font:inherit; font-size:0.86rem; color:var(--text); background:var(--incavo); border:1px solid var(--line);
                         border-radius:7px; padding:6px 9px; }
  .scegli-lista { max-height:min(52vh, 460px); overflow-y:auto; margin-top:8px; }
  #elenco-filtri { display:flex; gap:6px; }
  #elenco-filtri .scelta { flex:1; min-width:0; }
  #elenco-filtri .etichetta { display:flex; align-items:center; gap:7px; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pallino-fam { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--famiglia, var(--faint)); flex:none; }
  #elenco-corpo { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; margin:0 -4px; padding:0 4px; }
  .elenco-titolo { font-family:var(--strumento); font-size:0.68rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
                   color:var(--dim); padding:8px 6px 4px; display:flex; justify-content:space-between; gap:6px; }
  .elenco-titolo .conta { color:var(--faint); font-weight:400; letter-spacing:0; text-transform:none; }
  .riga-preset { display:flex; align-items:center; gap:7px; border-radius:7px; padding:4px 4px 4px 7px; cursor:pointer; min-height:30px; user-select:none; }
  .riga-preset:hover { background:var(--rialzo); }
  .riga-preset.suona { background:var(--accent); color:var(--su-accent); }
  .riga-preset .nome { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:0.86rem; }
  .riga-preset.vuoto .nome { color:var(--faint); font-style:italic; }
  .etichetta-ampli { font-family:var(--strumento); font-size:0.66rem; font-weight:700; letter-spacing:0.03em; border-radius:4px; padding:1px 5px;
                     flex:none; color:#fff; background:var(--faint); }
  .etichetta-ampli.a { background:var(--slot-a); }
  .etichetta-ampli.b { background:#2f9e5b; }
  .riga-preset .altro { flex:none; padding:1px 7px; font-size:0.95rem; line-height:1.1; background:transparent; border-color:transparent;
                        color:inherit; visibility:hidden; }
  .riga-preset:hover .altro, .riga-preset .altro:focus-visible { visibility:visible; }
  .riga-preset .altro:hover { background:var(--incavo); border-color:var(--line); }
  .riga-preset.suona .altro:hover { background:rgba(0,0,0,0.2); }
  .elenco-vuoto { color:var(--faint); font-size:0.82rem; padding:8px 6px; line-height:1.5; }
  .pallino-pedale { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ambra); margin-left:2px; }

  /* ---------------------------------------------------------------- le schermate a tutta finestra (Banchi, Pedale, Tuner) */
  .schermo { position:fixed; inset:0; z-index:25; background:var(--bg); display:flex; flex-direction:column; gap:14px; padding:16px 18px; }
  .sch-cima { display:flex; align-items:center; gap:8px; flex:none; }
  .sch-cima h2 { margin:0; font-family:var(--strumento); font-size:1.55rem; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; }
  .sch-cima .nota { color:var(--faint); font-size:0.8rem; }
  .sch-corpo { flex:1; min-height:0; display:grid; grid-template-columns:300px minmax(0, 1fr); gap:16px; }
  .sl-preset { display:flex; flex-direction:column; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .sl-preset input { margin:10px; padding:7px 10px; font:inherit; color:var(--text); background:var(--incavo); border:1px solid var(--line); border-radius:7px; }
  .sl-elenco { list-style:none; margin:0; padding:0 8px 10px; overflow-y:auto; flex:1; }
  .sl-elenco li { display:flex; align-items:center; gap:8px; padding:5px 6px 5px 8px; border-radius:7px; cursor:grab; user-select:none;
                  touch-action:none; font-size:0.88rem; }
  .sl-elenco li:hover { background:var(--rialzo); }
  .sl-elenco li.preso { opacity:0.35; }
  .sl-elenco .nome, .bl-posti .nome { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bl-blocchi { min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); grid-auto-rows:min-content;
                gap:22px; align-content:start; padding:18px; background:var(--incavo); border:1px solid var(--line); border-radius:12px; }
  .bl-blocco { display:flex; flex-direction:column; background:var(--panel2); border:1px solid #4d5868; border-radius:12px; overflow:hidden;
               box-shadow:0 8px 20px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05); transition:border-color 0.12s, background 0.12s; }
  .bl-testa { display:flex; align-items:center; gap:6px; padding:10px 8px 10px 12px; background:linear-gradient(#3a4452, #313a47);
              border-bottom:1px solid #4d5868; border-top:4px solid var(--accent); }
  .bl-blocco.ampli .bl-testa { border-top-color:var(--slot-a); }
  /* i banchi si spostano prendendoli per la testa, come le Songlist del Pulze */
  .bl-blocco[data-banco] .bl-testa { cursor:grab; touch-action:none; user-select:none; }
  .bl-blocco.sopra { border-color:var(--accent-chiaro); box-shadow:0 0 0 2px var(--accent), 0 10px 24px rgba(0,0,0,0.4); }
  /* il banco che si sposta: la copia vola col mouse, al suo posto un riquadro tratteggiato (come nel Pulze) */
  .blocco-volante { position:fixed; left:0; top:0; z-index:50; margin:0; pointer-events:none; opacity:0.96;
                    box-shadow:0 22px 44px rgba(0,0,0,0.6), 0 0 0 2px var(--accent-chiaro); }
  .bl-blocco.segnaposto { background:rgba(47,127,232,0.08); border:2px dashed var(--accent-chiaro) !important; box-shadow:none; }
  .bl-blocco.segnaposto > * { visibility:hidden; }
  .bl-nome { flex:1; min-width:0; font-family:var(--strumento); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bl-conta { font-family:var(--strumento); font-size:0.72rem; color:var(--dim); background:var(--incavo); border:1px solid var(--line);
              border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums; }
  .mini-tasto { padding:2px 7px; font-size:0.8rem; line-height:1.2; background:transparent; border-color:transparent; color:var(--faint); }
  .mini-tasto:hover:not(:disabled) { color:var(--text); background:var(--incavo); border-color:var(--line); }
  .mini-tasto.via:hover:not(:disabled) { color:var(--rosso); }
  .bl-posti { list-style:none; margin:8px; padding:4px; background:var(--incavo); border:1px solid var(--line); border-radius:8px; }
  .bl-posti li { display:flex; gap:8px; align-items:center; padding:4px 4px 4px 6px; border-radius:6px; font-size:0.86rem; cursor:pointer;
                 min-height:30px; user-select:none; touch-action:none; }
  .bl-posti li + li.lato { margin-top:6px; border-top:1px dashed var(--line); }
  .bl-posti li:hover { background:var(--rialzo); }
  .bl-posti li.vuoto { color:var(--faint); font-style:italic; cursor:default; }
  .bl-posti li.suona { background:var(--accent); color:var(--su-accent); }
  .bl-posti li.sopra { box-shadow:inset 0 0 0 2px var(--accent-chiaro); background:rgba(47,127,232,0.16); }
  .bl-posti li.preso { opacity:0.35; }
  .bl-posti .n { font-family:var(--strumento); color:var(--faint); min-width:1.8em; text-align:right; font-size:0.78rem; }
  .bl-posti li.suona .n { color:var(--su-accent); }
  .bl-posti li .mini-tasto { visibility:hidden; }
  .bl-posti li:hover .mini-tasto { visibility:visible; }
  .bl-piede { display:flex; gap:6px; padding:0 8px 10px; }
  .bl-piede button { flex:1; padding:5px 8px; font-size:0.76rem; }
  .bl-nuovo { border:2px dashed var(--line); border-radius:12px; display:grid; place-items:center; min-height:200px; color:var(--dim);
              background:transparent; font-size:0.95rem; }
  .bl-nuovo:hover { border-color:var(--accent-chiaro); color:var(--text); }
  .fantasma { position:fixed; left:0; top:0; z-index:50; pointer-events:none; padding:6px 12px; border-radius:8px; background:var(--accent);
              color:#fff; font-size:0.86rem; box-shadow:0 12px 26px rgba(0,0,0,0.55); white-space:nowrap; }
  .schermo.trascina, .schermo.trascina * { cursor:grabbing !important; }

  /* il pedale */
  .pd-corpo { flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:16px; align-content:start; }
  .pd-carta { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .pd-carta h3 { font-family:var(--strumento); font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }
  .pd-carta p { color:var(--dim); font-size:0.84rem; line-height:1.5; margin:0 0 10px; }
  .pd-stato { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pd-stato .lampada.on { background:var(--green); box-shadow:0 0 7px rgba(76,211,138,0.7); }
  .pd-riga { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 8px; border-radius:8px; }
  .pd-riga + .pd-riga { border-top:1px solid var(--line-soft); }
  .pd-riga .n { font-family:var(--strumento); color:var(--faint); min-width:1.6em; }
  .pd-riga .nome { flex:1; min-width:0; }
  .pd-riga .sotto { font-size:0.74rem; color:var(--faint); }
  .pd-riga .sotto.cambiato { color:var(--ambra); }
  .pd-riga.vuoto .nome { color:var(--faint); font-style:italic; }
  .pd-registro { font-family:Consolas, monospace; font-size:0.76rem; color:var(--dim); white-space:pre-wrap; background:var(--incavo);
                 border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:3em; margin:0 0 8px; }
  .barra-invio { height:4px; border-radius:2px; background:var(--incavo); overflow:hidden; margin-top:10px; }
  .barra-invio i { display:block; height:100%; width:0; background:var(--accent); transition:width 0.15s; }

  /* l'accordatore: le 21 tacche, la nota grande e i cent (i colori della vista Live dell'app) */
  .tn-corpo { flex:1; display:grid; place-items:center; }
  .tn-piastra { width:min(640px, 90vw); text-align:center; }
  .tn-piastra svg { width:100%; height:auto; display:block; }
  .tn-piastra .tacca { stroke-width:6; stroke-linecap:round; transition:opacity 0.08s; }
  .tn-piastra .tacca.accesa { filter:drop-shadow(0 0 6px currentColor); }
  .tn-piastra .segno { fill:var(--faint); font-size:22px; font-family:var(--strumento); }
  .tn-cent { font-family:var(--strumento); font-size:1.6rem; font-weight:600; color:var(--dim); min-height:2.2rem; margin-top:-46px; }
  .tn-cent small { font-size:0.8rem; margin-left:4px; color:var(--faint); }
  .tn-cent.calante { color:#2be4ff; }
  .tn-cent.crescente { color:#ff2bd6; }
  .tn-nota { font-family:var(--strumento); font-size:9rem; font-weight:700; line-height:1; margin-top:10px; min-height:9rem; color:var(--text); }
  .tn-nota .diesis { font-size:0.5em; vertical-align:super; }
  .tn-piastra.intonata .tn-nota { color:var(--green); text-shadow:0 0 28px rgba(76,211,138,0.5); }
  .tn-piastra.tace .tn-nota { color:var(--faint); }
  .tn-avviso { color:var(--dim); margin-top:14px; }

  /* le finestre larghe: categorie e doppioni */
  .riga-voce { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .riga-voce + .riga-voce { border-top:1px solid var(--line-soft); }
  .riga-voce .nome { flex:1; min-width:0; }
  .riga-voce input[type=color] { width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  .riga-voce input[type=text] { flex:1; margin:0; }

  /* ---------------------------------------------------------------- la catena in basso */

  .velo { position:fixed; inset:0; z-index:30; background:rgba(10,13,18,0.6); display:grid; place-items:center; }
  .finestra { width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 40px); overflow-y:auto; background:var(--panel);
              border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:0 20px 50px rgba(0,0,0,0.6); }

</head>
<body>

<header class="barra">
  <img class="logo" src="icons/logo.svg" alt="SparklingTones">
  <span id="stato"></span>
  <button id="genera-ia" title="Genera con l'IA"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>Genera con l'IA</span></button>
  <button id="rileggi" title="Rileggi dall'ampli il suono che sta facendo"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  <div class="gruppo" title="Il tempo del preset: gli effetti a tempo lo seguono"><span class="etichetta">BPM</span><input class="numero" id="bpm" inputmode="numeric" autocomplete="off"><button class="tap" id="tap" title="Batti il tempo">Tap</button></div>
  <span id="nome-ampli"></span>
  <button id="collega" class="primario"><span class="lampada"></span><span id="collega-testo">Collega</span></button>
  <button id="menu" title="Menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<div class="sotto-barra">
  <div class="sb-lato">
    <div class="gruppo">
      <button id="salva" title="Salva…"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span class="testo">Salva…</span></button>
    </div>
    <div class="gruppo">
      <button id="annulla" title="Annulla"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="ripeti" title="Ripeti"><svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button id="confronta" title="Confronta con il preset salvato">A/B</button><button type="button" class="aiuto" data-aiuto="ab">?</button>
    </div>
    <div class="gruppo">
      <button id="importa" title="Importa un file"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/></svg><span class="testo">Importa</span></button>
      <button id="esporta" title="Esporta il preset"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v5h16v-5"/></svg><span class="testo">Esporta</span></button>
    </div>
  </div>
  <div class="preset-centro">
    <div class="preset-riga">
      <button id="prima" class="freccia" title="Slot prima" aria-label="Slot prima"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <h1 id="preset-nome">—</h1>
      <button id="dopo" class="freccia" title="Slot dopo" aria-label="Slot dopo"><svg class="ico" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="accanto"><span id="preset-dove" hidden></span><span id="modificato" hidden>modificato · non salvato</span></span>
    </div>
  </div>
  <div class="sb-lato destra">
    <div class="gruppo">
      <button id="apri-live" title="La vista Live, con la pedaliera"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="10" rx="2"/><circle cx="8" cy="14" r="2"/><circle cx="16" cy="14" r="2"/><path d="M8 9V6M16 9V6"/></svg><span class="testo">Live</span></button>
      <button id="apri-banchi" title="I banchi, come le Songlist"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="testo">Banchi</span></button>
      <button id="apri-pedale" title="Il pedale SparklingTones"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5"/><circle cx="8" cy="13.5" r="2.2"/><circle cx="16" cy="13.5" r="2.2"/></svg><span class="testo">Pedale</span><span class="pallino-pedale" id="pallino-pedale" hidden></span></button>
      <button id="apri-tuner" title="L'accordatore dell'ampli"><svg class="ico" viewBox="0 0 24 24"><path d="M9 3v8a3 3 0 0 0 6 0V3M12 14v7"/></svg><span class="testo">Tuner</span></button>
    </div>
  </div>
</div>

<main class="centro">
 <div class="centro-sinistra">
  <section id="palco-vuoto">
    <div id="palco-vuoto-testo"></div>
  </section>
  <section id="palco" hidden>
    <div id="foto"></div>
    <div class="dettaglio">
      <div class="det-cima"><button class="etichetta-slot" id="det-chip" title="Acceso / spento"></button><span class="det-pos" id="det-pos"></span></div>
      <h2 id="det-nome"></h2>
      <p id="det-sotto"></p>
      <ul id="manopole"></ul>
    </div>
    <div class="modelli">
      <input id="cerca-modello" placeholder="Cerca modello…" autocomplete="off">
      <ul id="lista-modelli"></ul>
    </div>
  </section>
 </div>
  <aside id="elenco">
    <div class="elenco-cima">
      <input type="search" id="elenco-cerca" placeholder="cerca un preset…" autocomplete="off">
      <button id="elenco-ordine" title="come ordinare la libreria"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    </div>
    <div id="elenco-filtri"></div>
    <div id="elenco-corpo"></div>
  </aside>
</main>

<section class="catena" id="sezione-catena" hidden>
  <div class="catena-cima"><h2>Catena</h2></div>
  <div class="fila">
    <div class="capo"><b></b>IN</div>
    <div id="catena"></div>
    <div class="capo"><b></b>OUT</div>
  </div>
</section>

<input type="file" id="file-importa" hidden>

<script>window.LINGUA_PREDEFINITA = 'en'; /* la prima volta si apre in inglese; la scelta dell'utente poi vince */</script>
<script src="src/lingua.js"></script>
<script src="src/lingua-en.js"></script>
<script src="src/dropbox-sync.js"></script>
<script src="src/sync-auto.js"></script>
<script src="src/spark-protocol.js"></script>
<script src="src/spark-effetti.js"></script>
<script src="src/spark-immagini.js"></script>
<script src="src/spark-transport.js"></script>
<script src="src/preset-store.js"></script>
<script src="src/spark-backup.js"></script>
<script src="src/pc/01-base.js"></script>
<script src="src/pc/02-stato.js"></script>
<script src="src/pc/03-editor.js"></script>
<script src="src/pc/04-ampli.js"></script>
<script src="src/pc/05-file.js"></script>
<script src="src/pedale-ponte.js"></script>
<script src="src/pc/06-libreria.js"></script>
<script src="src/pc/07-banchi.js"></script>
<script src="src/pc/08-pedale.js"></script>
<script src="src/pc/09-accordatore.js"></script>
<script src="src/pc/10-partenza.js"></script>
<script src="src/pc/11-genera-ia.js"></script>
<script src="src/pc/12-live.js"></script>
<script>
  // Installabile come app a parte (pc.webmanifest): lo stesso service worker dell'app, che ha già la pagina nel guscio.
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
