<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Test preset-store</title>
<style>
  body { font-family:'SF Mono',Consolas,monospace; background:#14161a; color:#e8e8ea;
         padding:20px; font-size:0.85rem; line-height:1.6; }
  h1 { font-size:1.1rem; font-family:-apple-system,'Segoe UI',sans-serif; }
  .pass { color:#7fe08a; }
  .fail { color:#ff8080; }
  .group { color:#8a8f98; margin-top:14px; font-weight:700; }
  .detail { color:#8a8f98; margin-left:22px; white-space:pre-wrap; }
  #summary { margin:18px 0; padding:10px 14px; border-radius:8px; font-weight:700;
             font-family:-apple-system,'Segoe UI',sans-serif; }
  #summary.ok  { background:#1f3a24; color:#7fe08a; }
  #summary.bad { background:#3a2020; color:#ff8080; }
</style>
</head>
<body>
<h1>Test preset-store.js</h1>
<p class="detail" style="margin-left:0">Ogni esecuzione usa un database temporaneo, che
viene cancellato alla fine.</p>
<div id="summary">esecuzione…</div>
<div id="out"></div>

<script src="../src/preset-store.js"></script>
<script>
'use strict';

let passed = 0, failed = 0;

function check(name, actual, expected) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? passed++ : failed++;
  const div = document.createElement('div');
  div.innerHTML = `<span class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}</span>`;
  if (!ok) div.innerHTML += `<div class="detail">atteso:  ${e}\nottenuto: ${a}</div>`;
  document.getElementById('out').appendChild(div);
}

function group(title) {
  const div = document.createElement('div');
  div.className = 'group';
  div.textContent = title;
  document.getElementById('out').appendChild(div);
}

/** Preset minimale con la forma prodotta da Spark.parsePreset. */
function makePreset(uuid, name, effectNames, bpm) {
  return {
    bank: 0, number: 0, uuid, name,
    version: '0.7', description: '', icon: 'icon.png',
    bpm: bpm || 120,
    effects: (effectNames || []).map(n => ({
      name: n, enabled: true, params: [{ index: 0, value: 0.5 }],
    })),
    tail: [9990, 0.5], checksum: 0xe0,
  };
}

const DB_NAME = 'spark-test-' + Date.now();

(async function run() {
  const store = await new PresetStore(DB_NAME).open();

  /* ------------------------------------------------------------------ */
  group('inserimento e lettura');

  const idA = await store.add(makePreset('uuid-a', 'Shine On', ['Twin', 'DelayRe201']));
  const idB = await store.add(makePreset('uuid-b', 'Hey Jimi', ['JH.JTM45', 'JH.FuzzTone']));
  const idC = await store.add(makePreset('uuid-c', 'Nylon Reverb', ['FatAcousticV2']));

  check('count dopo tre inserimenti', await store.count(), 3);
  check('gli ordini sono progressivi', (await store.all()).map(r => r.order), [0, 1, 2]);
  check('get restituisce il preset giusto', (await store.get(idB)).name, 'Hey Jimi');
  check('byUuid trova per UUID', (await store.byUuid('uuid-c')).name, 'Nylon Reverb');

  const fresh = await store.get(idA);
  check('i campi utente sono inizializzati',
        [fresh.tags, fresh.notes, fresh.favorite], [[], '', false]);

  /* ------------------------------------------------------------------ */
  group('tag');

  await store.setTags(idA, ['  Gilmour ', 'clean', 'gilmour', '', 'Clean']);
  check('i tag vengono ripuliti e deduplicati senza badare al maiuscolo',
        (await store.get(idA)).tags, ['Gilmour', 'clean']);

  await store.addTag(idA, 'pink floyd');
  check('addTag aggiunge in coda', (await store.get(idA)).tags, ['Gilmour', 'clean', 'pink floyd']);

  await store.addTag(idA, 'CLEAN');
  check('addTag non duplica un tag già presente',
        (await store.get(idA)).tags, ['Gilmour', 'clean', 'pink floyd']);

  await store.removeTag(idA, 'CLEAN');
  check('removeTag ignora il maiuscolo', (await store.get(idA)).tags, ['Gilmour', 'pink floyd']);

  await store.setTags(idB, ['hendrix', 'fuzz']);
  await store.setTags(idC, ['acustica']);
  check('allTags conta gli usi e a parità ordina alfabeticamente, maiuscole comprese',
        (await store.allTags()).map(t => t.tag + ':' + t.count).join(' '),
        'acustica:1 fuzz:1 Gilmour:1 hendrix:1 pink floyd:1');

  await store.addTag(idB, 'clean');
  await store.addTag(idC, 'clean');
  check('il tag più usato viene per primo', (await store.allTags())[0], { tag: 'clean', count: 2 });
  await store.removeTag(idB, 'clean');
  await store.removeTag(idC, 'clean');

  /* ------------------------------------------------------------------ */
  group('preferiti e note');

  check('toggleFavorite accende', await store.toggleFavorite(idB), true);
  check('toggleFavorite spegne',  await store.toggleFavorite(idB), false);
  await store.toggleFavorite(idB);

  await store.setNotes(idA, 'usare col manico, volume a 7');
  check('le note vengono salvate', (await store.get(idA)).notes, 'usare col manico, volume a 7');

  /* ------------------------------------------------------------------ */
  group('ricerca');

  check('ricerca per nome',        (await store.search('jimi')).map(r => r.name), ['Hey Jimi']);
  check('ricerca per effetto',     (await store.search('delayre201')).map(r => r.name), ['Shine On']);
  check('ricerca per tag',         (await store.search('hendrix')).map(r => r.name), ['Hey Jimi']);
  check('ricerca nelle note',      (await store.search('manico')).map(r => r.name), ['Shine On']);
  check('più termini vanno in AND', (await store.search('jimi fuzz')).map(r => r.name), ['Hey Jimi']);
  check('termini in AND non correlati non trovano nulla',
        (await store.search('jimi gilmour')).length, 0);
  check('query vuota restituisce tutto', (await store.search('')).length, 3);
  check('filtro preferiti',
        (await store.search('', { favoritesOnly: true })).map(r => r.name), ['Hey Jimi']);
  check('filtro per tag esatto',
        (await store.search('', { tag: 'ACUSTICA' })).map(r => r.name), ['Nylon Reverb']);

  /* ------------------------------------------------------------------ */
  group('ordinamento manuale');

  check('sposto l\'ultimo in cima',
        (await store.move(idC, 0)) .length, 3);
  check('il nuovo ordine è quello atteso',
        (await store.all()).map(r => r.name), ['Nylon Reverb', 'Shine On', 'Hey Jimi']);
  check('gli ordini restano 0..n-1 senza buchi',
        (await store.all()).map(r => r.order), [0, 1, 2]);

  await store.move(idC, 99);
  check('un indice fuori scala finisce in fondo',
        (await store.all()).map(r => r.name), ['Shine On', 'Hey Jimi', 'Nylon Reverb']);

  /* ------------------------------------------------------------------ */
  group('import dall\'ampli');

  // stesso UUID di "Shine On": è lo stesso preset, modificato sull'ampli
  const modificato = makePreset('uuid-a', 'Shine On v2', ['Twin', 'DelayMono'], 132);
  modificato.slot = 0;
  const nuovo = makePreset('uuid-d', 'Europa', ['AmericanHighGain']);
  nuovo.slot = 5;

  const esito = await store.importFromAmp([modificato, nuovo]);
  check('import: uno aggiunto, uno aggiornato', esito, { added: 1, updated: 1 });
  check('la libreria è cresciuta di uno', await store.count(), 4);

  const dopo = await store.get(idA);
  check('la parte sonora viene aggiornata',
        [dopo.name, dopo.bpm, dopo.effects.map(e => e.name).join(',')],
        ['Shine On v2', 132, 'Twin,DelayMono']);
  check('i tag dell\'utente sopravvivono all\'import', dopo.tags, ['Gilmour', 'pink floyd']);
  check('le note sopravvivono all\'import', dopo.notes, 'usare col manico, volume a 7');
  check('l\'ordine manuale sopravvive all\'import', dopo.order, 0);
  check('lo slot sull\'ampli viene registrato, come lista', dopo.slots, [0]);

  const ancora = await store.importFromAmp([modificato, nuovo]);
  check('reimportare gli stessi preset non ne aggiunge altri', ancora, { added: 0, updated: 2 });

  /* ------------------------------------------------------------------ */
  group('scaletta');

  check('la scaletta parte vuota', (await store.getSetlist()).length, 0);

  await store.addToSetlist(idB);
  await store.addToSetlist(idA);
  check('la scaletta conserva l\'ordine di inserimento',
        (await store.getSetlist()).map(r => r.name), ['Hey Jimi', 'Shine On v2']);

  await store.addToSetlist(idB);
  check('aggiungere due volte lo stesso preset non lo duplica',
        (await store.getSetlist()).length, 2);

  await store.removeFromSetlist(idB);
  check('si può togliere un preset dalla scaletta',
        (await store.getSetlist()).map(r => r.name), ['Shine On v2']);

  // un preset cancellato non deve lasciare un pulsante morto
  const usaEGetta = await store.add(makePreset('uuid-tmp', 'Temporaneo', []));
  await store.addToSetlist(usaEGetta);
  check('il preset appena aggiunto è in scaletta', (await store.getSetlist()).length, 2);
  await store.remove(usaEGetta);
  check('cancellare un preset lo toglie di fatto dalla scaletta',
        (await store.getSetlist()).map(r => r.name), ['Shine On v2']);

  await store.setSetting('prova', { a: 1 });
  check('le preferenze si rileggono', await store.getSetting('prova'), { a: 1 });
  check('una preferenza mancante restituisce il valore di ripiego',
        await store.getSetting('inesistente', 'ripiego'), 'ripiego');

  /* ------------------------------------------------------------------ */
  group('assegnazione degli slot');

  // idA sta nello slot 0; se ci mettiamo idC, idA non deve restare lì
  await store.assignSlots({ [idC]: 0, [idB]: 1 });
  check('gli slot richiesti vengono assegnati',
        [(await store.get(idC)).slots, (await store.get(idB)).slots], [[0], [1]]);
  check('chi occupava uno slot riassegnato lo perde',
        (await store.get(idA)).slots, []);
  check('gli slot non toccati restano dove sono',
        (await store.byUuid('uuid-d')).slots, [5]);

  /* ------------------------------------------------------------------ */
  group('backup');

  const backup = await store.exportAll();
  check('il backup ha il formato atteso',
        [backup.format, backup.version, backup.presets.length],
        ['spark-controller-library', 1, 4]);

  await store.clear();
  check('clear svuota la libreria', await store.count(), 0);

  const reimportati = await store.importBackup(backup, { replace: true });
  check('il backup viene reimportato per intero', reimportati, 4);
  check('i preset tornano nello stesso ordine',
        (await store.all()).map(r => r.name),
        backup.presets.map(r => r.name));
  check('i tag sopravvivono al giro di backup',
        (await store.byUuid('uuid-a')).tags, ['Gilmour', 'pink floyd']);

  let errore = null;
  try { await store.importBackup({ format: 'qualcos-altro' }); }
  catch (e) { errore = e.message; }
  check('un file estraneo viene rifiutato', errore, 'il file non è un backup della libreria');

  /* ------------------------------------------------------------------ */
  group('gli otto dell\'ampli');

  const suAmpli = await store.hardware();
  check('hardware restituisce sempre otto posti', suAmpli.length, 8);
  check('ogni preset sta al suo slot, i posti ignoti restano vuoti',
        suAmpli.map(r => (r ? r.name : null)),
        ['Nylon Reverb', 'Hey Jimi', null, null, null, 'Europa', null, null]);

  /* ------------------------------------------------------------------ */
  group('lo stesso preset in più slot');

  // Il caso vero: sull'ampli lo stesso suono è copiato in due posti. Con un
  // campo `slot` singolo l'ultimo letto vinceva e l'altro sembrava vuoto.
  const copiato = s => Object.assign(makePreset('uuid-c', 'Nylon Reverb', ['FatAcousticV2']),
                                     { slot: s });
  await store.importFromAmp([copiato(0), copiato(3)]);
  check('lo stesso preset letto in due slot se li tiene tutti e due',
        (await store.byUuid('uuid-c')).slots, [0, 3]);

  const inDuePosti = await store.hardware();
  check('e compare in tutti e due i posti dell\'ampli',
        [inDuePosti[0] && inDuePosti[0].name, inDuePosti[3] && inDuePosti[3].name],
        ['Nylon Reverb', 'Nylon Reverb']);

  // ora in A4 c'è un altro preset: il doppione perde quello slot, non l'altro
  await store.importFromAmp([Object.assign(makePreset('uuid-b', 'Hey Jimi', []), { slot: 3 })]);
  check('chi perde uno slot tiene gli altri', (await store.byUuid('uuid-c')).slots, [0]);
  check('e chi lo prende lo aggiunge ai suoi',
        (await store.byUuid('uuid-b')).slots, [1, 3]);

  // una lettura che fallisce su qualche slot non deve cancellare il resto
  await store.importFromAmp([copiato(0)]);
  check('una lettura parziale lascia in pace gli slot che non ha visto',
        (await store.byUuid('uuid-b')).slots, [1, 3]);

  /* ------------------------------------------------------------------ */
  group('banchi');

  const idShine = (await store.byUuid('uuid-a')).id;
  const idJimi  = (await store.byUuid('uuid-b')).id;

  check('non c\'è nessun banco all\'inizio', (await store.getBanks()).length, 0);

  const banco = await store.addBank('Primo set');
  check('un banco nasce con otto posti vuoti',
        [banco.nome, banco.posti],
        ['Primo set', [null, null, null, null, null, null, null, null]]);

  await store.setBankSlot(banco.id, 0, idShine);
  await store.setBankSlot(banco.id, 7, idJimi);
  check('i preset finiscono nei posti scelti',
        (await store.getBanks())[0].posti,
        [idShine, null, null, null, null, null, null, idJimi]);

  await store.setBankSlot(banco.id, 0, null);
  check('un posto si può svuotare', (await store.getBanks())[0].posti[0], null);

  let fuoriBanco = null;
  try { await store.setBankSlot(banco.id, 8, idShine); } catch (e) { fuoriBanco = e.message; }
  check('un posto oltre l\'ottavo è un errore',
        fuoriBanco, 'posto 8 fuori dal banco: ce ne sono 8');

  await store.renameBank(banco.id, 'Secondo set');
  check('un banco si rinomina', (await store.getBanks())[0].nome, 'Secondo set');

  const daButtare = await store.add(makePreset('uuid-x', 'Usa e getta', []));
  await store.setBankSlot(banco.id, 3, daButtare);
  check('il preset appena messo occupa il posto',
        (await store.getBanks())[0].posti[3], daButtare);
  await store.remove(daButtare);
  check('cancellare un preset lascia il posto vuoto, non un pulsante morto',
        (await store.getBanks())[0].posti[3], null);

  await store.addBank('Terzo set');
  check('i banchi si accumulano',
        (await store.getBanks()).map(b => b.nome), ['Secondo set', 'Terzo set']);
  await store.removeBank(banco.id);
  check('un banco si elimina', (await store.getBanks()).map(b => b.nome), ['Terzo set']);

  /* ------------------------------------------------------------------ */
  group('categorie');

  check('le categorie in uso compaiono anche senza essere state dichiarate',
        (await store.allCategories()).map(c => c.nome + ':' + c.quanti).join(' '),
        'acustica:1 fuzz:1 Gilmour:1 hendrix:1 pink floyd:1');

  await store.addCategory('  Assoli  ');
  check('una categoria si può creare prima di avere qualcosa da metterci',
        (await store.allCategories())[0], { nome: 'Assoli', quanti: 0 });

  await store.addCategory('assoli');
  check('crearla due volte non la duplica',
        (await store.allCategories()).filter(c => c.nome.toLowerCase() === 'assoli').length, 1);

  await store.addTag(idShine, 'Assoli');
  check('assegnarla la fa contare',
        (await store.allCategories())[0], { nome: 'Assoli', quanti: 1 });

  await store.renameCategory('assoli', 'Assoli lunghi');
  check('rinominare cambia il nome sui preset',
        (await store.get(idShine)).tags, ['Gilmour', 'pink floyd', 'Assoli lunghi']);
  check('e anche nell\'elenco', (await store.allCategories())[0].nome, 'Assoli lunghi');

  await store.removeCategory('GILMOUR');
  check('eliminare una categoria la toglie dai preset, senza badare al maiuscolo',
        (await store.get(idShine)).tags, ['pink floyd', 'Assoli lunghi']);

  const azzerate = await store.clearCategories();
  check('azzerare le conta tutte, dichiarate e no', azzerate, 5);
  check('dopo l\'azzeramento non ne resta nessuna', (await store.allCategories()).length, 0);
  check('e nessun preset ne porta più',
        (await store.all()).every(r => r.tags.length === 0), true);
  check('i preset però ci sono ancora tutti', await store.count(), 4);

  /* ------------------------------------------------------------------ */
  group('nomi dei parametri');

  check('all\'inizio nessun parametro ha un nome', await store.getParamNames(), {});
  check('e chiederne uno non inventa niente', await store.paramName('DelayRe201', 1), null);

  await store.setParamName('DelayRe201', 1, '  Mix  ');
  check('il nome viene ripulito dagli spazi', await store.paramName('DelayRe201', 1), 'Mix');
  check('vale per il modello, non per un preset',
        await store.getParamNames(), { DelayRe201: { 1: 'Mix' } });

  await store.setParamName('DelayRe201', 0, 'Tempo');
  check('più parametri dello stesso effetto convivono',
        await store.getParamNames(), { DelayRe201: { 0: 'Tempo', 1: 'Mix' } });

  await store.setParamName('DelayRe201', 1, '');
  check('un nome vuoto lo riporta al numero',
        await store.getParamNames(), { DelayRe201: { 0: 'Tempo' } });

  await store.setParamName('DelayRe201', 0, '');
  check('e tolto l\'ultimo sparisce anche l\'effetto',
        await store.getParamNames(), {});

  // Battesimi e categorie sono lavoro dell'utente che non si ricava da
  // nessun'altra parte: perderli esportando sarebbe il modo più stupido di
  // buttarli via.
  await store.setParamName('Twin', 4, 'Master');
  await store.addCategory('Da esportare');
  const conNomi = await store.exportAll();
  await store.setSetting('nomiParametri', {});
  await store.setSetting('categorie', []);
  await store.importBackup(conNomi);
  check('i nomi dei parametri sopravvivono al giro di backup',
        await store.paramName('Twin', 4), 'Master');
  check('e le categorie dichiarate anche',
        (await store.getSetting('categorie', [])).includes('Da esportare'), true);

  await store.setParamName('Twin', 4, 'Volume');
  await store.importBackup(conNomi);
  check('reimportare un backup vecchio non sovrascrive un battesimo più recente',
        await store.paramName('Twin', 4), 'Volume');

  /* ------------------------------------------------------------------ */
  group('categorie del backup dell\'app ufficiale');

  const conCategoria = makePreset('uuid-e', 'Blues Rig', ['Bassman']);
  conCategoria.tags = ['Blues'];
  await store.importFromBackup([conCategoria]);
  check('le categorie del backup non entrano in libreria',
        (await store.byUuid('uuid-e')).tags, []);

  const voluta = makePreset('uuid-f', 'Metal Rig', ['AmericanHighGain']);
  voluta.tags = ['Metal'];
  await store.importFromBackup([voluta], { categorieDalBackup: true });
  check('a richiesta invece entrano', (await store.byUuid('uuid-f')).tags, ['Metal']);

  /* ------------------------------------------------------------------ */
  group('la scaletta di prima diventa un banco');

  const DB_VECCHIO = DB_NAME + '-vecchio';
  const vecchio = await new PresetStore(DB_VECCHIO).open();
  const v1 = await vecchio.add(makePreset('uuid-v1', 'Uno', []));
  const v2 = await vecchio.add(makePreset('uuid-v2', 'Due', []));
  await vecchio.addToSetlist(v2);
  await vecchio.addToSetlist(v1);
  await vecchio.setSetting('banchi', null);      // com'era prima che i banchi esistessero
  vecchio.close();

  const riaperto = await new PresetStore(DB_VECCHIO).open();
  const migrati = await riaperto.getBanks();
  check('la scaletta si ritrova come primo banco, nello stesso ordine',
        [migrati.length, migrati[0].nome, migrati[0].posti.slice(0, 2)],
        [1, 'Scaletta', [v2, v1]]);
  check('e il banco ha comunque i suoi otto posti', migrati[0].posti.length, 8);

  await riaperto.addBank('Aggiunto dopo');
  riaperto.close();
  const ancoraRiaperto = await new PresetStore(DB_VECCHIO).open();
  check('la migrazione non si ripete a ogni apertura',
        (await ancoraRiaperto.getBanks()).map(b => b.nome), ['Scaletta', 'Aggiunto dopo']);
  ancoraRiaperto.close();
  await PresetStore.deleteDatabase(DB_VECCHIO);

  /* ------------------------------------------------------------------ */
  group('da slot singolo a lista');

  const DB_SLOT = DB_NAME + '-slot';
  const primaDellaLista = await new PresetStore(DB_SLOT).open();
  const idVecchio = await primaDellaLista.add(makePreset('uuid-old', 'Vecchio stile', []));
  const grezzo = await primaDellaLista.get(idVecchio);
  delete grezzo.slots;                 // com'erano i record prima della lista
  grezzo.slot = 4;
  await primaDellaLista.put(grezzo);
  await primaDellaLista.setSetting('slotComeLista', false);
  primaDellaLista.close();

  const conLista = await new PresetStore(DB_SLOT).open();
  const convertito = await conLista.get(idVecchio);
  check('il vecchio campo slot diventa una lista', convertito.slots, [4]);
  check('e il campo singolo sparisce, per non avere due verità',
        'slot' in convertito, false);
  check('il preset finisce al posto giusto fra gli otto',
        (await conLista.hardware()).map(r => (r ? r.name : null))[4], 'Vecchio stile');
  conLista.close();
  await PresetStore.deleteDatabase(DB_SLOT);

  /* ------------------------------------------------------------------ */
  group('errori');

  let mancante = null;
  try { await store.setNotes(99999, 'x'); } catch (e) { mancante = e.message; }
  check('modificare un preset inesistente è un errore', mancante, 'preset 99999 inesistente');

  /* ------------------------------------------------------------------ */
  store.close();
  await PresetStore.deleteDatabase(DB_NAME);

  const s = document.getElementById('summary');
  s.className = failed === 0 ? 'ok' : 'bad';
  s.textContent = `${passed} passati, ${failed} falliti`;
})().catch(err => {
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = 'errore fatale: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
