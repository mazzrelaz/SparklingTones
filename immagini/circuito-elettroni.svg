<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
  <!-- Le piste del fondo dei pulsantoni (le stesse del disegno fermo), con la
       corrente che le percorre: puntini di luce dall'azzurro al fucsia che
       scorrono, per il pulsante del preset che suona. Si ripete a mattonelle. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2be4ff"/>
      <stop offset=".55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="alone" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#7b5cff" stroke-opacity=".3" stroke-width="1">
    <path d="M0 20h30l10 10h40"/>
    <path d="M120 70H90l-10-10H50l-8 8H0"/>
    <path d="M60 0v14l8 8"/>
    <path d="M20 90V76l10-10"/>
  </g>
  <g fill="#7b5cff" fill-opacity=".4">
    <circle cx="80" cy="30" r="2"/>
    <circle cx="42" cy="68" r="2"/>
    <circle cx="68" cy="22" r="2"/>
  </g>
  <g fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" filter="url(#alone)">
    <path d="M0 20h30l10 10h40" pathLength="100" stroke-dasharray="7 93">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M120 70H90l-10-10H50l-8 8H0" pathLength="100" stroke-dasharray="6 94">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.1s" begin="-.7s" repeatCount="indefinite"/>
    </path>
    <path d="M60 0v14l8 8" pathLength="100" stroke-dasharray="14 86">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="-.4s" repeatCount="indefinite"/>
    </path>
    <path d="M20 90V76l10-10" pathLength="100" stroke-dasharray="14 86">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.4s" begin="-1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
