<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Montaggio del video</title>
<style>
  @font-face { font-family:'Inter'; src:url('../../fonts/inter-latin.woff2') format('woff2'); font-weight:400 700; }
  @font-face { font-family:'Space Grotesk'; src:url('../../fonts/space-grotesk-latin.woff2') format('woff2'); font-weight:500 700; }
  body { margin:0; background:#000; }
  canvas { width:270px; height:480px; }
</style>
</head>
<body>
<canvas id="tela" width="1080" height="1920"></canvas>
<script>
// Rimonta i fotogrammi registrati da registra.js in un video verticale 1080×1920:
// il telefono al centro, la didascalia sopra, titolo e finale in dissolvenza.
// Va in tempo reale, perché MediaRecorder prende i tempi dall'orologio.
'use strict';

const L = 1080, H = 1920, FPS = 30;
const INTRO = 3.0;
let OUTRO = 4.5;
const tela = document.getElementById('tela');
const g = tela.getContext('2d');
const logo = new Image();
logo.src = '../../icons/icon-192.png';

async function monta() {
  const linea = await (await fetch('/__uscita/linea.json')).json();
  await document.fonts.load('700 60px "Space Grotesk"');
  await document.fonts.load('500 40px Inter');
  await new Promise(r => { if (logo.complete) r(); else logo.onload = logo.onerror = r; });
  if (linea.outro) OUTRO = linea.outro;
  // La voce, se c'è: decodificata tutta prima, a 48 kHz.
  let voce = null;
  if (linea.voce) {
    const ctx = new OfflineAudioContext(2, 1, 48000);
    const buf = await ctx.decodeAudioData(await (await fetch('/__uscita/' + linea.voce.file)).arrayBuffer());
    voce = { buf, taglio: linea.voce.taglio || 0, silenzi: linea.voce.silenzi || [],
             pezzi: linea.voce.pezzi, momenti: linea.voce.momenti };
  }
  avvia(linea, voce).catch(e =>
    fetch('/__salva?nome=errore.txt', { method: 'POST', body: String((e && e.stack) || e) }));
  return 'H.264 ' + FPS + ' fps costanti' + (voce ? ' + AAC' : '');
}

async function avvia(linea, voce) {
  const F = linea.fotogrammi;
  const durata = linea.fine - linea.inizio;
  const cache = new Map();                    // indice → ImageBitmap
  let guasto = null;
  const inCorso = new Set();

  const carica = i => {
    if (i < 0 || i >= F.length || cache.has(i) || inCorso.has(i)) return;
    inCorso.add(i);
    fetch('/__uscita/fotogrammi/' + F[i].f).then(r => r.blob()).then(createImageBitmap)
      .then(b => { cache.set(i, b); inCorso.delete(i); })
      .catch(e => { guasto = new Error('fotogramma ' + F[i].f + ': ' + e.message); });
  };
  // l'ultimo fotogramma non successivo al tempo t
  const indice = t => {
    let lo = 0, hi = F.length - 1, ris = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (F[m].t <= t) { ris = m; lo = m + 1; } else hi = m - 1; }
    return ris;
  };
  const didascalia = t => {
    let d = null;
    for (const x of linea.didascalie) if (x.t <= t) d = x;
    return d;
  };

  // il telefono
  const s = 0.95, w = linea.largo * s, h = linea.alto * s;
  const x0 = (L - w) / 2, y0 = H - h - 56;

  function rettangoloTondo(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function fondo() {
    g.fillStyle = '#060607'; g.fillRect(0, 0, L, H);
    const r = g.createRadialGradient(L / 2, 120, 20, L / 2, 120, 900);
    r.addColorStop(0, 'rgba(230,30,45,.22)'); r.addColorStop(1, 'rgba(230,30,45,0)');
    g.fillStyle = r; g.fillRect(0, 0, L, H);
  }
  function testoCentrato(testo, y, font, colore, alfa = 1) {
    g.save(); g.globalAlpha = alfa; g.font = font; g.fillStyle = colore;
    const largo = g.measureText(testo).width;
    if (largo > L - 80) {
      const px = parseFloat(font.match(/(\d+)px/)[1]);
      g.font = font.replace(/\d+px/, Math.floor(px * (L - 80) / largo) + 'px');
    }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(testo, L / 2, y); g.restore();
  }
  const dolce = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);

  let ultimoIndiceDisegnato = -1;
  let ultimaBitmap = null;
  function disegna(tau) {
    const t = linea.inizio + tau;
    const i = indice(t);
    for (let k = i; k < i + 45; k++) carica(k);
    for (const k of cache.keys()) if (k < i - 2) { cache.get(k).close(); cache.delete(k); }
    let b = null;
    for (let k = i; k >= 0 && k > i - 60; k--) if (cache.has(k)) { b = cache.get(k); break; }
    if (b) ultimaBitmap = b;

    fondo();
    // la didascalia, che entra in dissolvenza
    const d = didascalia(t);
    if (d && d.testo) {
      const a = dolce((t - d.t) / 0.3);
      g.save(); g.globalAlpha = a;
      g.fillStyle = '#e11d2e'; g.fillRect(L / 2 - 40, 70, 80, 6);
      g.restore();
      testoCentrato(d.testo, 150, '600 46px Inter', '#f4f4f5', a);
    }
    // il telefono
    g.save();
    g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 50;
    rettangoloTondo(x0 - 6, y0 - 6, w + 12, h + 12, 44);
    g.fillStyle = '#1b1b1f'; g.fill();
    g.restore();
    g.save();
    rettangoloTondo(x0, y0, w, h, 38); g.clip();
    g.fillStyle = '#000'; g.fillRect(x0, y0, w, h);
    if (ultimaBitmap) g.drawImage(ultimaBitmap, x0, y0, w, h);
    g.restore();

    // i cartelli, sopra l'app ferma: il primo rigo grande, gli altri sotto
    for (const c of linea.cartelli || []) {
      if (t < c.t0 || t > c.t1) continue;
      const a = Math.min(dolce((t - c.t0) / 0.5), dolce((c.t1 - t) / 0.5));
      g.save(); g.globalAlpha = a * 0.95; g.fillStyle = '#060607'; g.fillRect(0, 0, L, H); g.restore();
      if (logo.complete && logo.naturalWidth) {
        g.save(); g.globalAlpha = a; g.drawImage(logo, L / 2 - 70, 560, 140, 140); g.restore();
      }
      testoCentrato(c.righe[0], 800, '700 84px "Space Grotesk"', '#ffffff', a);
      c.righe.slice(1).forEach((r, k) => {
        // le righe entrano una dopo l'altra
        const ak = a * dolce((t - c.t0 - 0.8 - k * 0.9) / 0.5);
        testoCentrato(r, 930 + k * 80, '500 46px Inter', k === c.righe.length - 2 ? '#f43f5e' : '#d4d4d8', ak);
      });
    }

    // titolo e finale
    let velo = 0, quale = null;
    if (tau < INTRO) { velo = 1 - dolce((tau - (INTRO - 0.8)) / 0.8); quale = 'intro'; }
    if (tau > durata - OUTRO) { velo = dolce((tau - (durata - OUTRO)) / 0.7); quale = 'outro'; }
    if (velo > 0) {
      g.save(); g.globalAlpha = velo * 0.94; g.fillStyle = '#060607'; g.fillRect(0, 0, L, H); g.restore();
      const T = linea.testi;
      if (logo.complete && logo.naturalWidth) {
        g.save(); g.globalAlpha = velo; g.drawImage(logo, L / 2 - 90, 620, 180, 180); g.restore();
      }
      testoCentrato(quale === 'intro' ? T.titolo : T.fine1, 900, '700 96px "Space Grotesk"', '#ffffff', velo);
      if (quale === 'intro') {
        testoCentrato(T.sottotitolo, 1000, '500 46px Inter', '#d4d4d8', velo);
      } else {
        testoCentrato(T.fine2, 1000, '500 44px Inter', '#d4d4d8', velo);
        testoCentrato(T.fine3, 1080, '600 40px Inter', '#f43f5e', velo);
        testoCentrato(T.nota, 1800, '400 28px Inter', '#71717a', velo);
      }
    }
  }

  /* Il montaggio non va più in tempo reale: ogni fotogramma si disegna e si
     codifica col suo tempo esatto, k/30 di secondo. Così la cadenza è fissa
     (DaVinci Resolve non vuole i video a cadenza variabile, e MediaRecorder
     li faceva così) e il risultato non dipende da quanto è carico il computer.
     I byte codificati vanno a registra.js, che scrive l'MP4 (scrivi-mp4.js). */
  const dorme = ms => new Promise(r => setTimeout(r, ms));
  const assicura = async i => { carica(i); while (!cache.has(i)) { if (guasto) throw guasto; await dorme(4); } };

  const video = { misure: [], chiavi: [], pezzi: [], tempi: [], descrizione: null };
  const enc = new VideoEncoder({
    output: (c, meta) => {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (d && !video.descrizione) video.descrizione = Array.from(new Uint8Array(d.buffer || d));
      const byte = new Uint8Array(c.byteLength);
      c.copyTo(byte);
      video.pezzi.push(byte); video.misure.push(byte.length);
      video.chiavi.push(c.type === 'key'); video.tempi.push(c.timestamp);
    },
    error: e => { guasto = e; },
  });
  enc.configure({ codec: 'avc1.640028', width: L, height: H, bitrate: 8_000_000, framerate: FPS,
                  hardwareAcceleration: 'prefer-software', avc: { format: 'avc' } });
  const N = Math.round(durata * FPS);
  for (let k = 0; k < N; k++) {
    if (guasto) throw guasto;
    const tau = k / FPS;
    const i = indice(linea.inizio + tau);
    for (let j = i; j < i + 30; j++) carica(j);
    await assicura(i);
    disegna(tau);
    const fotogramma = new VideoFrame(tela, { timestamp: Math.round(k * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(fotogramma, { keyFrame: k % (FPS * 2) === 0 });
    fotogramma.close();
    while (enc.encodeQueueSize > 6) await dorme(2);
    if (k % 150 === 0) fetch('/__salva?nome=passo', { method: 'POST', body: k + '/' + N });
  }
  await enc.flush();
  enc.close();
  if (guasto) throw guasto;
  for (let k = 1; k < video.tempi.length; k++) {
    if (video.tempi[k] <= video.tempi[k - 1]) throw new Error('fotogrammi fuori ordine: B-frame non previsti');
  }

  // La voce: tagliata in testa, coi rumori zittiti, lunga quanto il video.
  let audio = null;
  if (voce) {
    const sr = 48000, ch = 2, n = Math.round(durata * sr);
    const pcm = [new Float32Array(n), new Float32Array(n)];
    for (let c = 0; c < ch; c++) {
      const sorgente = voce.buf.getChannelData(Math.min(c, voce.buf.numberOfChannels - 1));
      if (voce.pezzi) {
        // a pezzi: ognuno dove la sua scena è partita davvero
        for (const [chiave, quando] of Object.entries(voce.momenti)) {
          const pz = voce.pezzi[chiave];
          const x = Math.round(pz.da * sr), y = Math.round((pz.da + pz.durata) * sr);
          const dove = Math.round(quando * sr);
          pcm[c].set(sorgente.subarray(x, Math.min(y, x + n - dove)), dove);
        }
      } else {
        const da = Math.round(voce.taglio * voce.buf.sampleRate);
        pcm[c].set(sorgente.subarray(da, da + n));
      }
    }
    const rampa = 480;                                   // 10 ms, niente clic
    for (const [x0, x1] of voce.silenzi) {
      const p = Math.max(0, Math.round((x0 - voce.taglio) * sr));
      const q = Math.min(n, Math.round((x1 - voce.taglio) * sr));
      if (q <= p) continue;
      for (const canale of pcm) {
        for (let j = 0; j < rampa; j++) {
          if (p - rampa + j >= 0) canale[p - rampa + j] *= 1 - j / rampa;
          if (q + j < n) canale[q + j] *= j / rampa;
        }
        canale.fill(0, p, q);
      }
    }
    audio = { sr, ch, misure: [], pezzi: [], descrizione: null };
    const aenc = new AudioEncoder({
      output: (c, meta) => {
        const d = meta && meta.decoderConfig && meta.decoderConfig.description;
        if (d && !audio.descrizione) audio.descrizione = Array.from(new Uint8Array(d.buffer || d));
        const byte = new Uint8Array(c.byteLength);
        c.copyTo(byte);
        audio.pezzi.push(byte); audio.misure.push(byte.length);
      },
      error: e => { guasto = e; },
    });
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 });
    const blocco = 4800;
    for (let j = 0; j < n; j += blocco) {
      const m = Math.min(blocco, n - j);
      const dati = new Float32Array(m * ch);
      for (let c = 0; c < ch; c++) dati.set(pcm[c].subarray(j, j + m), c * m);
      aenc.encode(new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: m,
                                  numberOfChannels: ch, timestamp: Math.round(j * 1e6 / sr), data: dati }));
      while (aenc.encodeQueueSize > 20) await dorme(2);
    }
    await aenc.flush();
    aenc.close();
    if (guasto) throw guasto;
    // AAC-LC, 48 kHz, stereo, se l'encoder non l'ha detto da sé
    if (!audio.descrizione) audio.descrizione = [0x11, 0x90];
  }

  const posta = (nome, corpo) => fetch('/__salva?nome=' + nome, { method: 'POST', body: corpo });
  await posta('video.bin', new Blob(video.pezzi));
  if (audio) await posta('audio.bin', new Blob(audio.pezzi));
  await posta('fatto.json', JSON.stringify({
    fps: FPS, larghezza: L, altezza: H,
    video: { misure: video.misure, chiavi: video.chiavi, descrizione: video.descrizione },
    audio: audio && { sr: audio.sr, ch: audio.ch, misure: audio.misure, descrizione: audio.descrizione },
  }));
}
</script>
</body>
</html>
