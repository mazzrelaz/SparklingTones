<!doctype html>
<meta charset="utf-8">
<title>Banco di prova — StompSnake</title>
<!-- Gli indirizzi si contano dalla radice del sito: il gioco chiede
     `icons/stompsnake.png`, che da `tools/` non esisterebbe. -->
<base href="/">
<!--
  Fa girare `src/snake-pedali.js` da solo, senza l'app intorno, e racconta
  cosa è successo. Serve perché il gioco non è coperto da nessuna suite e
  `index.html` nemmeno: qui si vede in dieci secondi se muove, se mangia, se
  la pausa ferma davvero e se lo scontro col muro finisce la partita.

  Gira anche in un browser senza schermo:

    msedge --headless=new --disable-gpu --virtual-time-budget=12000 --dump-dom
           http://localhost:8099/tools/snake-banco.html

  e l'esito si legge dentro <pre id="esito">. Tre trappole pagate:
  - il ciclo del gioco è un `setInterval` e non `requestAnimationFrame`
    apposta, perché in headless rAF non gira affatto (un fotogramma solo);
  - il tempo virtuale non aspetta IndexedDB da freddo, ed è il motivo per cui
    questa pagina non carica l'app: non le serve, e da sola parte subito;
  - il service worker dell'app serve i file della corsa precedente anche qui,
    e per questo il gioco si carica con una query in coda.

  **Qui il vestito non è quello dell'app**: il CSS qui sotto è una copia
  ridotta di quattro classi, e la scena può risultare spostata o larga in modo
  diverso. Per giudicare l'impaginazione si guarda l'app vera, misurandola —
  `document.documentElement.scrollWidth` contro `clientWidth`. Questo è un
  banco per la logica.
-->
<style>
  /* Il minimo indispensabile di quello che il gioco si aspetta dall'app:
     le variabili di colore e quattro classi. Senza le variabili il neon dei
     tasti resta senza fondo e sembra rotto, ma è il banco a mancare. */
  :root { --bg:#000; --panel:#121316; --line:#26282e; --text:#e8e8ea; --dim:#8a8f98;
          --accent:#e30613; --gold:#f0c040; --strumento:'Space Grotesk',monospace; }
  body { margin:0; background:#000; color:#e8e8ea; font-family:sans-serif; }
  .pannello { display:none; position:fixed; inset:0; background:#000; z-index:10;
               overflow:auto; padding:14px; }
  .pannello.aperto { display:block; }
  .barra-alta { display:flex; align-items:center; gap:10px; margin-bottom:12px;
                flex-wrap:wrap; }
  button { background:#1a1c20; color:#e8e8ea; border:1px solid #26282e;
           border-radius:8px; padding:8px 12px; }
  button.primary { background:#e30613; border-color:#e30613; color:#fff; }
  .spiega { color:#8a8f98; font-size:0.8rem; }
  /* Con `?zoom` in coda all'indirizzo la tela viene ingrandita quattro volte:
     è l'unico modo di guardare davvero i pixel di un pedalino. */
  body.zoom .snake-scena { max-width:none; }
  body.zoom .snake-tela canvas { width:832px; height:896px; }
  #esito { position:fixed; right:8px; bottom:8px; z-index:50; color:#8f8;
           font:12px monospace; white-space:pre; background:#000; padding:6px; }
</style>
<pre id="esito">in corso</pre>
<script>
  // Con `Math.random` fissa la batteria finisce sempre nella stessa casella,
  // che con questo valore è quella davanti alla testa: la partita diventa
  // ripetibile, e «ha mangiato» si può affermare invece di sperarlo.
  Math.random = () => 0.582;
  document.write('<script src="src/snake-pedali.js?banco=' + Date.now() + '"><\/script>');
</script>
<script>
const righe = [];
const esito = document.getElementById('esito');
const hud = nome => document.querySelector('#pannelloSnake [data-snake=' + nome + ']').textContent;

if (location.search.indexOf('zoom') >= 0) document.body.classList.add('zoom');
SnakePedali.apri();
righe.push('aperto: ' + !!document.querySelector('#pannelloSnake canvas'));
document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp' }));

setTimeout(() => {
  righe.push('dopo un passo: punti=' + hud('punti') + ' — ' + hud('nome'));
}, 700);

setTimeout(() => {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));   // pausa
  const fermo = hud('punti');
  setTimeout(() => {
    righe.push('in pausa non avanza: ' + (fermo === hud('punti') ? 'giusto' : 'AVANZA LO STESSO'));
    document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));  // riparte
  }, 900);
}, 1400);

setTimeout(() => {
  righe.push('finita: ' + !document.querySelector('.snake-fine').hidden);
  righe.push('titolo: ' + hud('titolo'));
  righe.push('motivo: ' + hud('motivo'));
  righe.push('punti finali: ' + hud('punti') + ' — record: ' + hud('record'));
  esito.textContent = righe.join('\n');
}, 6000);
</script>
